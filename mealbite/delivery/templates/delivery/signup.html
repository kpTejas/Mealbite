{% extends "delivery/base.html" %}

{% block title %}Sign Up | MealBite{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" style="max-width: 520px;">
        <div class="auth-header">
            <div class="auth-logo">🍕</div>
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Join MealBite and start exploring your local favorites</p>
        </div>

        <form action="{% url 'signup' %}" method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="e.g. foodlover99" value="{{ username|default:'' }}" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Create a secure password" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" value="{{ email|default:'' }}" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile" class="form-control" placeholder="10-digit number" value="{{ mobile|default:'' }}" required>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Delivery Address</label>
                <textarea id="address" name="address" class="form-control" placeholder="Flat, Street, Area, City & Pincode" rows="2" required>{{ address|default:'' }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">
                Sign Up & Start Ordering
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{% url 'open_signin' %}">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
